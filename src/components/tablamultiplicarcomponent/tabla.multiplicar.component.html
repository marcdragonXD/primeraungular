<h1>Tabla de Multiplicar (ElementRef)</h1>
<form #formtabla="ngForm" (ngSubmit)="generarTabla()">
    <label>Introduce un número: </label>
    <input type="number" #cajanumero /><br/>
    <button>Ver Tabla</button>
</form>

<h2 style="color: blue">Resultados (Versión 1):</h2>
<ul>
    <li *ngFor="let resultado of resultados">{{resultado}}</li>
</ul>

<h2 style="color: blue">Operación y Resultado (Versión 2):</h2>
<ul>
    <li *ngFor="let operacion of operaciones">{{operacion}}</li>
</ul>
